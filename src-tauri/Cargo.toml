[package]
name = "cloudvault"
version = "1.0.0"
description = "Unified cloud browser — connect Google Drive, OneDrive & Dropbox, browse files, play media, download with one click."
authors = ["CloudVault Team"]
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/cloudvault-app"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cloudvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
keyring = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
